server:
  port: 8084

spring:
  application:
    name: score-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        dashboard: 127.0.0.1:8080
        port: 8719
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_score_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root_password
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

feign:
  sentinel:
    enabled: true # 激活 Sentinel 配合 Feign 进行熔断

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
